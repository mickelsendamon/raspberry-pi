{% extends "base.html" %}

{% block title %}Delete Chore{% endblock title %}

{% block content %}
<h1>Warning! You are about to delete a Chore.</h1>
<h3>{{chore.title}} is about to be deleted</h3>
<p>Are you sure you want to delete this chore?</p>
<div class="row text-center">
    <div class="col">
        <form method="post">
            {% csrf_token %}
            <input type="submit" value="Delete" class="btn btn-danger">
        </form>
    </div>
    <div class="col">
        <a href="{% url 'chores:chore_detail' chore.pk %}" class="btn btn-secondary">Cancel</a>
    </div>
</div>
{% endblock content %}
