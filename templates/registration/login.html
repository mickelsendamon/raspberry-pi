{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<h2>Login</h2>
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label for="id_username">Email:</label>
    {{ form.username }}
    <label for="id_password">Password:</label>
    {{ form.password }}
    <button type="submit">Login</button>
</form>
{% endblock %}
